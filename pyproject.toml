[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "onelinerproject"
version = "0.0.1"
authors = [
  { name="Aljo", email="author@example.com" },
]
description = "An experimental AST-based Python one-liner transformer"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/Aljoberg/OnelinerProject"
Issues = "https://github.com/Aljoberg/OnelinerProject/issues"

[project.scripts]
oneliner = "onelinerproject.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/onelinerproject"]
